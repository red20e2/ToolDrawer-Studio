name: Apply Generate Integration Patch

on:
  push:
    branches:
      - feature/v0.1-generate-manufacturing

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.1-generate-manufacturing
          fetch-depth: 0
      - name: Apply assertion-checked integration patches
        shell: bash
        run: |
          python scripts/apply_generate_integration_patch.py
          python scripts/apply_generate_main_window_patch_v2.py
      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No integration patch changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tooldrawer_studio/ui/workflow_controller.py src/tooldrawer_studio/ui/main_window.py
          git commit -m "feat: integrate generate workflow into main window"
          git push origin HEAD:feature/v0.1-generate-manufacturing

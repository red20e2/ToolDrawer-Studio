name: Fix Generate Hardening

on:
  push:
    branches:
      - feature/v0.1-generate-manufacturing

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.1-generate-manufacturing
          fetch-depth: 0
      - shell: bash
        run: |
          python scripts/fix_generate_main_window.py
          python scripts/patch_validation_scoop_lip.py
      - shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tooldrawer_studio/ui/main_window.py src/tooldrawer_studio/generation/validation.py
          git commit -m "fix: close Generate hardening gaps"
          git push origin HEAD:feature/v0.1-generate-manufacturing

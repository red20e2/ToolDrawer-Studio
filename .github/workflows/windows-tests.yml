name: Windows Tests

on:
  pull_request: {}

concurrency:
  group: windows-tests-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Toolchain versions
        shell: pwsh
        run: |
          python --version
          $Candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe")
          )
          $Iscc = $Candidates | Where-Object { $_ -and (Test-Path $_ -PathType Leaf) } | Select-Object -First 1
          if (-not $Iscc) { throw "ISCC.exe not found" }
          $Version = (Get-Item $Iscc).VersionInfo.FileVersion
          Write-Host "iscc=$Iscc version=$Version"
      - name: Import and bytecode sanity
        run: |
          python -m compileall -q src tests
          python -c "from tooldrawer_studio.ui.main_window import MainWindow; from tooldrawer_studio.measurement.service import ThicknessMeasurementService; print('imports-ok')"
          python -c "import shapely; from tooldrawer_studio.layout.packer import pack_layout; from tooldrawer_studio.ui.arrange_panel import ArrangePanel; print('arrange-imports-ok')"
          python -c "from tooldrawer_studio.generation.builder import generate_organizer; from tooldrawer_studio.generation.gridfinity import PROFILE; from tooldrawer_studio.ui.generate_panel import GeneratePanel; from tooldrawer_studio.ui.model_preview import ModelPreview; print('generation-imports-ok')"
          python -c "from tooldrawer_studio.generation.foam import build_foam_body; from tooldrawer_studio.layout.models import LayoutState; model=build_foam_body(LayoutState(mode='foam', foam_width_mm=60.0, foam_height_mm=40.0), 10.0); assert model.val().isValid(); print('generation-build-ok')"
      - name: Run tests
        run: python -m pytest -q
      - name: Build frozen Windows app
        shell: pwsh
        run: ./packaging/build_app.ps1
      - name: Verify frozen Windows app
        shell: pwsh
        run: ./packaging/verify_frozen.ps1
      - name: Build release artifacts
        shell: pwsh
        run: ./packaging/build_artifacts.ps1
      - name: Inspect release artifacts
        shell: pwsh
        run: |
          $AppVersion = (python -c "from tooldrawer_studio.version import __version__; print(__version__)").Trim()
          if ([string]::IsNullOrWhiteSpace($AppVersion)) { throw "Application version is empty" }
          $Expected = @(
            "artifacts/ToolDrawer-Studio-$AppVersion-Setup.exe",
            "artifacts/ToolDrawer-Studio-$AppVersion-Portable.zip",
            "artifacts/SHA256SUMS.txt"
          )
          foreach ($Path in $Expected) {
            if (-not (Test-Path $Path -PathType Leaf)) { throw "Missing release artifact: $Path" }
            $Item = Get-Item $Path
            if ($Item.Length -le 0) { throw "Empty release artifact: $Path" }
            Write-Host ("artifact={0} bytes={1}" -f $Item.Name, $Item.Length)
          }
          Write-Host "sha256-manifest-begin"
          Get-Content artifacts/SHA256SUMS.txt
          Write-Host "sha256-manifest-end"
      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ToolDrawer-Studio-PR-${{ github.event.pull_request.number }}-Windows
          path: artifacts/
          if-no-files-found: error

name: V0.1.0 Release Bootstrap

on:
  push:
    branches:
      - 'release/v0.1.0-bootstrap'

permissions:
  contents: write

env:
  RELEASE_TAG: v0.1.0
  RELEASE_SHA: 7ace6d09deb750fe39ebf0e5fd960e01a3aa8922

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Verify release target is still main
        shell: pwsh
        run: |
          $mainSha = (git ls-remote origin refs/heads/main).Split("`t")[0]
          if ($mainSha -ne $env:RELEASE_SHA) {
            throw "main moved: expected $env:RELEASE_SHA, found $mainSha"
          }
          $existingTag = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if ($existingTag) {
            throw "Tag $env:RELEASE_TAG already exists"
          }

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Validate release version
        shell: pwsh
        run: python packaging/check_version.py $env:RELEASE_TAG

      - name: Install package and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run full test suite
        run: python -m pytest -q

      - name: Build and verify release artifacts
        shell: pwsh
        run: ./packaging/build_artifacts.ps1 -AppVersion 0.1.0

      - name: Inspect release payload
        shell: pwsh
        run: |
          Get-ChildItem artifacts -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "$($_.Name) bytes=$($_.Length) sha256=$hash"
          }
          Get-Content artifacts/SHA256SUMS.txt

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG `
            "artifacts/ToolDrawer-Studio-0.1.0-Setup.exe" `
            "artifacts/ToolDrawer-Studio-0.1.0-Portable.zip" `
            "artifacts/SHA256SUMS.txt" `
            --repo "${{ github.repository }}" `
            --target $env:RELEASE_SHA `
            --title "ToolDrawer Studio 0.1.0" `
            --notes-file "docs/V0.1_RELEASE_NOTES.md" `
            --prerelease

      - name: Verify published prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view $env:RELEASE_TAG --repo "${{ github.repository }}" --json tagName,isPrerelease,targetCommitish,assets,url

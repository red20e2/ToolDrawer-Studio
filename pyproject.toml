[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tooldrawer-studio"
version = "0.0.1"
description = "Local-first tool tracing and organizer design for Windows"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6>=6,<7",
  "numpy>=2,<3",
  "opencv-python>=4,<5",
  "cadquery>=2,<3",
  "qrcode>=8,<9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
